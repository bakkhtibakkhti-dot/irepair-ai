                technicalLessons: "Tech Lessons", customerName: "Customer Name", customerPhone: "Phone Number", deviceModel: "Device Model",
                faultDesc: "Fault Description", repairCost: "Repair Cost", createInvoice: "Create Invoice", markReady: "Mark Ready",
                sendWhatsapp: "WhatsApp", close: "Close", save: "Save", edit: "Edit", delete: "Delete", shopName: "Shop Name",
                shopLogo: "Shop Logo", invoiceTitle: "Repair Invoice", noInvoices: "No invoices", systemsCount: "System",
                diagnosticSteps: "Diagnostic Steps", addStep: "Add Step", easyToHard: "Easiest to hardest", lessonDetails: "Lesson Details",
                systemInfo: "System Info", version: "Version 2.0", bgColor: "Background Color", aiAssistant: "AI Assistant",
                askAI: "Ask AI", describeProblem: "Describe the problem", analyzing: "Analyzing problem...", splashBgColor: "Splash Color",
                splashBgImage: "Splash Image", aiMode: "AI Mode", apiKey: "API Key (Gemini)", smartMode: "Smart Simulation",
                realAI: "Real AI (Gemini)", saveSettings: "Save Settings", howToGetKey: "How to get a free API key?",
                stepsToGetKey: "1. Go to Google AI Studio (ai.google.dev) 2. Sign in 3. Click 'Get API Key' 4. Create and copy your key.",
                testConnection: "Test Connection", connectionSuccess: "✅ Connection successful! API is working.",
                connectionFailed: "❌ Connection failed. Check your key and make sure you're using HTTPS/Live Server.",
                corsWarning: "⚠️ API may not work from local files (file://). Use Live Server or HTTPS.",
                selectModel: "Select Gemini Model", modelAuto: "Auto"
            }
        };
        let lang = "ar";
        function t(key) { return langMap[lang][key] || key; }

        // ---------- البيانات ----------
        let appData = {
            devices: [
                { id: "phone", nameAr: "هاتف", nameEn: "Phone", systems: [] },
                { id: "laptop", nameAr: "لاب توب", nameEn: "Laptop", systems: [] },
                { id: "tv", nameAr: "تلفاز", nameEn: "TV", systems: [] }
            ],
            invoices: [],
            shop: { name: "iRepair AI Pro", logo: "", bgColor: "#0a0a0f", splashBgColor: "#0a0a0f", splashBgImage: "", aiMode: "smart", geminiApiKey: "", selectedModel: "auto" }
        };

        // قائمة النماذج المدعومة
        const geminiModels = ["gemini-2.0-flash-exp", "gemini-1.5-flash", "gemini-1.5-pro"];

        function initDemo() {
            if (localStorage.getItem("irepair_ai_pro")) return;
            appData.devices[0].systems = [{
                id: "s1", nameAr: "منظومة الشحن", nameEn: "Charging System",
                diagnosis: [
                    { ar: "لا يشحن", en: "No charging", steps: [{ ar: "استخدم كابل أصلي", en: "Use original cable" }, { ar: "نظف المنفذ", en: "Clean port" }] },
                    { ar: "شحن بطيء", en: "Slow charging", steps: [{ ar: "أعد التشغيل", en: "Restart" }] }
                ],
                lessons: []
            }];
            saveData();
        }
        function saveData() { localStorage.setItem("irepair_ai_pro", JSON.stringify(appData)); }
        function loadData() {
            let d = localStorage.getItem("irepair_ai_pro");
            if (d) appData = JSON.parse(d);
            else initDemo();
            for (let dev of appData.devices)
                for (let sys of dev.systems)
                    for (let diag of sys.diagnosis)
                        if (!diag.steps) diag.steps = [];
            if (!appData.shop.bgColor) appData.shop.bgColor = "#0a0a0f";
            if (!appData.shop.splashBgColor) appData.shop.splashBgColor = "#0a0a0f";
            if (!appData.shop.aiMode) appData.shop.aiMode = "smart";
            if (!appData.shop.selectedModel) appData.shop.selectedModel = "auto";
            applyBg(); applySplashBg();
        }
        function applyBg() { document.getElementById("appContainer").style.backgroundColor = appData.shop.bgColor; }
        function applySplashBg() {
            const splash = document.getElementById("splashScreen");
            if (splash) {
                splash.style.backgroundColor = appData.shop.splashBgColor;
                if (appData.shop.splashBgImage) splash.style.backgroundImage = `url('${appData.shop.splashBgImage}')`;
                else splash.style.backgroundImage = "none";
                splash.style.backgroundSize = "cover";
                splash.style.backgroundPosition = "center";
            }
        }
        function updateSplashLogo() {
            const splashLogo = document.getElementById("splashLogo");
            if (splashLogo) splashLogo.innerHTML = appData.shop.logo ? `<img src="${appData.shop.logo}">` : "🔧";
        }
        function updateHeaderLogo() {
            const headerLogo = document.getElementById("headerLogo");
            if (headerLogo) headerLogo.innerHTML = appData.shop.logo ? `<img src="${appData.shop.logo}">` : "🔧";
        }
        function genId() { return Date.now() + "-" + Math.random().toString(36); }

        // شاشة الترحيب
        let isSplashVisible = true;
        function hideSplash() {
            const splash = document.getElementById("splashScreen");
            if (splash && isSplashVisible) {
                splash.classList.add("hide");
                isSplashVisible = false;
                if (currentView === "diagnostics") renderDiagnostics();
                else if (currentView === "invoices") renderInvoices();
                else renderSettings();
                updateNav(); updateHeaderLogo();
            }
        }
        document.getElementById("startBtn")?.addEventListener("click", hideSplash);

        // ---------- الذكاء الاصطناعي المحسن مع التبديل التلقائي للنماذج ----------
        function smartAIDiagnosis(problem, device, system) {
            problem = problem.toLowerCase();
            let steps = [], explanation = "";
            if (problem.includes("شحن") || problem.includes("charging") || problem.includes("بطارية")) {
                steps = ["🔌 جرب كابل وشاحن آخرين.", "🧹 نظف منفذ الشحن برفق.", "📱 اختبر الشاحن على جهاز آخر.", "🔋 قس جهد البطارية (3.7-4.2V).", "🛠️ قد يكون IC الشحن تالفًا."];
                explanation = "مشاكل الشحن غالبًا سببها الكابل أو المنفذ. إذا لم تنجح الخطوات السابقة، قد تحتاج لاستبدال بطارية أو إصلاح دائرة الشحن.";
            } else if (problem.includes("صوت") || problem.includes("sound")) {
                steps = ["🎧 تأكد من مستوى الصوت ليس صامتًا.", "🔌 جرب سماعات خارجية.", "🔄 أعد تشغيل الجهاز.", "🔧 قد يكون مكبر الصوت تالفًا."];
                explanation = "إذا عمل الصوت عبر السماعات الخارجية، فالعطل في السماعة الداخلية أو دائرة الصوت.";
            } else if (problem.includes("شاشة") || problem.includes("screen")) {
                steps = ["📺 أعد التشغيل.", "🔆 تحقق من سطوع الشاشة.", "🖥️ اختبر على شاشة خارجية.", "🛠️ قد تكون الشاشة أو كابل الشاشة تالفًا."];
                explanation = "إذا ظهرت الصورة على شاشة خارجية، فالعطل في الشاشة الداخلية. وإلا فقد يكون كارت الشاشة أو الرام.";
            } else if (problem.includes("بطء") || problem.includes("slow") || problem.includes("تجميد")) {
                steps = ["🗑️ احذف الملفات المؤقتة.", "🔄 أعد التشغيل.", "📊 تحقق من استخدام المعالج.", "💾 قد يكون الهارد ديسك تالفًا."];
                explanation = "البطء قد يكون بسبب تراكم الملفات أو نقص الذاكرة. جرب تشغيل وضع Safe Mode.";
            } else if (problem.includes("واي فاي") || problem.includes("wifi") || problem.includes("انترنت")) {
                steps = ["📡 أعد تشغيل الراوتر والجهاز.", "🔁 نسى الشبكة وأعد الاتصال.", "🔧 تحقق من إعدادات IP.", "🛠️ قد يكون هناك عطل في دائرة الواي فاي."];
                explanation = "تأكد من أن الواي فاي يعمل على أجهزة أخرى. إذا كانت المشكلة متكررة، قد تحتاج إلى إعادة ضبط الشبكات.";
            } else {
                steps = ["🔍 أعد تشغيل الجهاز.", "📖 ابحث في دليل المستخدم.", "🔧 استشر فنيًا متخصصًا.", "🖥️ حاول تحديث البرامج الثابتة."];
                explanation = "من الأفضل البدء بإعادة التشغيل والتحقق من التحديثات.";
            }
            return `📱 **${device}** | **${system}**\n📝 **المشكلة:** ${problem}\n\n✅ **خطوات مقترحة:**\n${steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\n💡 **تفسير:** ${explanation}`;
        }

        async function callGeminiAPIWithModel(prompt, apiKey, model) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const requestBody = {
                contents: [{ parts: [{ text: `أنت خبير صيانة إلكترونيات محترف. قدم تشخيصًا دقيقًا وحلولاً عملية لمشكلة: ${prompt}. استخدم لغة عربية واضحة ومختصرة. قدم خطوات مرتبة من الأسهل للأصعب.` }] }],
                generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
            };
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) {
                    let errorText = await response.text();
                    console.error(`Model ${model} error:`, response.status, errorText);
                    if (response.status === 403 || response.status === 401) return { success: false, error: "invalid_key" };
                    if (response.status === 404) return { success: false, error: "model_not_found" };
                    return { success: false, error: `api_error: ${response.status}` };
                }
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) return { success: false, error: "empty_response" };
                return { success: true, text: text };
            } catch (error) {
                console.error(`Network error with model ${model}:`, error);
                if (error.message.includes("Failed to fetch")) return { success: false, error: "cors_error" };
                return { success: false, error: `network_error: ${error.message}` };
            }
        }

        async function callGeminiAPIWithFallback(prompt, apiKey, preferredModel = null) {
            let modelsToTry = [];
            if (preferredModel && preferredModel !== "auto") {
                modelsToTry = [preferredModel];
            } else {
                modelsToTry = [...geminiModels]; // auto: جرب الكل
            }
            for (let model of modelsToTry) {
                const result = await callGeminiAPIWithModel(prompt, apiKey, model);
                if (result.success) {
                    return { success: true, text: result.text, modelUsed: model };
                } else if (result.error === "invalid_key") {
                    return { success: false, error: "invalid_key", modelUsed: model };
                } else if (result.error === "cors_error") {
                    return { success: false, error: "cors_error", modelUsed: model };
                }
                // استمر في تجربة النماذج الأخرى
            }
            return { success: false, error: "all_models_failed", lastModel: modelsToTry[modelsToTry.length-1] };
        }

        async function getAIResponse(problem, device, system) {
            if (appData.shop.aiMode === "real" && appData.shop.geminiApiKey && appData.shop.geminiApiKey.trim() !== "") {
                const preferredModel = appData.shop.selectedModel || "auto";
                const result = await callGeminiAPIWithFallback(problem, appData.shop.geminiApiKey, preferredModel);
                if (result.success) {
                    return `🤖 **Gemini AI (${result.modelUsed})**\n📱 ${device} | ${system}\n📝 المشكلة: ${problem}\n\n${result.text}`;
                } else if (result.error === "invalid_key") {
                    return `⚠️ **مفتاح API غير صالح أو منتهي الصلاحية.**\nالرجاء التحقق من المفتاح في الإعدادات.\n\n**الوضع الذكي (محاكاة) بديل:**\n\n${smartAIDiagnosis(problem, device, system)}`;
                } else if (result.error === "cors_error") {
                    return `⚠️ **خطأ في الاتصال (CORS).**\nلا يمكن للمتصفح الاتصال بـ Gemini API مباشرة من الملفات المحلية. يرجى استخدام **Live Server** (تشغيل الخادم المحلي) أو رفع التطبيق على استضافة HTTPS.\n\n**الوضع الذكي (محاكاة) بديل:**\n\n${smartAIDiagnosis(problem, device, system)}`;
                } else {
                    return `⚠️ **تعذر الاتصال بـ Gemini API بعد تجربة جميع النماذج.**\nتأكد من صحة المفتاح ومن اتصال الإنترنت.\n\n**الوضع الذكي (محاكاة) بديل:**\n\n${smartAIDiagnosis(problem, device, system)}`;
                }
            } else {
                return smartAIDiagnosis(problem, device, system);
            }
        }

        async function testGeminiConnection(apiKey, selectedModel) {
            if (!apiKey || apiKey.trim() === "") return "no_key";
            const testPrompt = "قل فقط: مرحبا، الاتصال ناجح.";
            const result = await callGeminiAPIWithFallback(testPrompt, apiKey, selectedModel);
            if (result.success) return "success";
            if (result.error === "invalid_key") return "invalid_key";
            if (result.error === "cors_error") return "cors_error";
            return "failed";
        }

        // دوال CRUD مختصرة (كما هي من قبل)

        function openStepsModal(sysId, diagIdx) {

            document.querySelectorAll('.printInvBtn').forEach(btn => btn.addEventListener('click', () => printInvoice(btn.dataset.id)));
            document.querySelectorAll('.markReadyBtn').forEach(btn => btn.addEventListener('click', () => markInvoiceReady(btn.dataset.id)));
            document.querySelectorAll('.sendWABtn').forEach(btn => btn.addEventListener('click', () => sendWhatsApp(btn.dataset.phone, btn.dataset.name)));
        }
        function markInvoiceReady(id) { let inv = appData.invoices.find(i => i.id === id); if (inv) { inv.status = "ready"; saveData(); renderInvoices(); sendWhatsApp(inv.customerPhone, inv.customerName); } }
        function sendWhatsApp(phone, name) { let msg = `${lang === 'ar' ? `مرحباً ${name}، جهازك جاهز في iRepair AI Pro` : `Hello ${name}, your device is ready at iRepair AI Pro`}`; window.open(`https://wa.me/${phone.replace(/[^0-9+]/g, '')}?text=${encodeURIComponent(msg)}`); }
        function printInvoice(id) { let inv = appData.invoices.find(i => i.id === id); if (!inv) return; let win = window.open('', '_blank'); win.document.write(`<html><head><title>Invoice</title><style>body{font-family:sans-serif;padding:20px}</style></head><body><div style="text-align:center"><h2>iRepair AI Pro</h2><h3>${t('invoiceTitle')}</h3><hr><p><strong>${t('customerName')}:</strong> ${inv.customerName}<br><strong>${t('customerPhone')}:</strong> ${inv.customerPhone}<br><strong>${t('deviceModel')}:</strong> ${inv.deviceModel}<br><strong>${t('faultDesc')}:</strong> ${inv.faultDesc}<br><strong>${t('repairCost')}:</strong> ${inv.cost} SAR</p><hr><p>${new Date().toLocaleDateString()}</p></div></body></html>`); win.print(); win.close(); }

        function renderSettings() {
            let html = `
                <div class="card">
                    <h3>${t('shopName')}</h3><input type="text" id="shopNameInput" value="iRepair AI Pro" disabled>
                    <h3>${t('shopLogo')}</h3><input type="file" id="logoUpload" accept="image/*"><div id="logoPreview" style="margin:10px 0;">${appData.shop.logo ? `<img src="${appData.shop.logo}" style="max-width:100px;border-radius:20px;">` : '<span class="text-accent">📷 لا يوجد شعار</span>'}</div>
                    <h3>${t('bgColor')}</h3><input type="color" id="bgColorPicker" value="${appData.shop.bgColor}">
                    <h3>${t('splashBgColor')}</h3><input type="color" id="splashBgColorPicker" value="${appData.shop.splashBgColor}">
                    <h3>${t('splashBgImage')}</h3><input type="file" id="splashBgUpload" accept="image/*"><div id="splashBgPreview" style="margin:10px 0;">${appData.shop.splashBgImage ? `<img src="${appData.shop.splashBgImage}" style="max-width:100px;border-radius:20px;">` : '<span class="text-accent">🖼️ لا توجد صورة</span>'}</div><button id="removeSplashBg" class="btn-sm">🗑️ ${t('removeImage')}</button>
                    <hr>
                    <h3>${t('aiMode')}</h3>
                    <select id="aiModeSelect"><option value="smart" ${appData.shop.aiMode === 'smart' ? 'selected' : ''}>${t('smartMode')}</option><option value="real" ${appData.shop.aiMode === 'real' ? 'selected' : ''}>${t('realAI')}</option></select>
                    <div id="apiKeyDiv" style="${appData.shop.aiMode === 'real' ? 'display:block' : 'display:none'}">
                        <h3>${t('apiKey')}</h3>
                        <input type="password" id="geminiApiKey" placeholder="AIzaSy..." value="${appData.shop.geminiApiKey || ''}">
                        <h3>${t('selectModel')}</h3>
                        <select id="modelSelect">
                            <option value="auto" ${appData.shop.selectedModel === 'auto' ? 'selected' : ''}>${t('modelAuto')}</option>
                            ${geminiModels.map(m => `<option value="${m}" ${appData.shop.selectedModel === m ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                        <button id="testApiBtn" class="btn-sm" style="margin-top:10px;"><i class="fas fa-vial"></i> ${t('testConnection')}</button>
                        <div class="info-box"><i class="fas fa-info-circle"></i> ${t('howToGetKey')}<br><small>${t('stepsToGetKey')}</small></div>
                        <div class="info-box" style="background:#ffaa0020; border-color:#ffaa00;"><i class="fas fa-exclamation-triangle"></i> ${t('corsWarning')}</div>
                    </div>
                    <button id="saveSettingsBtn" class="btn-primary" style="margin-top:20px;">${t('saveSettings')}</button>
                </div>
                <div class="card"><h3><i class="fas fa-brain"></i> ${t('aiAssistant')}</h3><p>${lang === 'ar' ? 'يمكنك اختيار وضع المحاكاة الذكية (دون مفتاح) أو وضع Gemini API الحقيقي (يتطلب مفتاحاً مجانياً من Google AI Studio). للتشغيل المحلي، استخدم Live Server لتجنب مشاكل CORS.' : 'Choose Smart Simulation (no key) or Real Gemini API (requires free key from Google AI Studio). For local testing, use Live Server to avoid CORS issues.'}</p></div>
            `;
            document.getElementById("mainContent").innerHTML = html;
            document.getElementById('logoUpload')?.addEventListener('change', e => { let file = e.target.files[0]; if (file) { let reader = new FileReader(); reader.onload = ev => { appData.shop.logo = ev.target.result; saveData(); updateHeaderLogo(); updateSplashLogo(); document.getElementById('logoPreview').innerHTML = `<img src="${ev.target.result}" style="max-width:100px;border-radius:20px;">`; }; reader.readAsDataURL(file); } });
            document.getElementById('bgColorPicker')?.addEventListener('input', e => { appData.shop.bgColor = e.target.value; applyBg(); });
            document.getElementById('splashBgColorPicker')?.addEventListener('input', e => { appData.shop.splashBgColor = e.target.value; applySplashBg(); });
            document.getElementById('splashBgUpload')?.addEventListener('change', e => { let file = e.target.files[0]; if (file) { let reader = new FileReader(); reader.onload = ev => { appData.shop.splashBgImage = ev.target.result; applySplashBg(); if (document.getElementById('splashBgPreview')) document.getElementById('splashBgPreview').innerHTML = `<img src="${ev.target.result}" style="max-width:100px;">`; saveData(); }; reader.readAsDataURL(file); } });
            document.getElementById('removeSplashBg')?.addEventListener('click', () => { appData.shop.splashBgImage = ""; applySplashBg(); if (document.getElementById('splashBgPreview')) document.getElementById('splashBgPreview').innerHTML = '<span class="text-accent">🖼️ لا توجد صورة</span>'; saveData(); });
            document.getElementById('aiModeSelect')?.addEventListener('change', e => { appData.shop.aiMode = e.target.value; document.getElementById('apiKeyDiv').style.display = appData.shop.aiMode === 'real' ? 'block' : 'none'; saveData(); });
            document.getElementById('modelSelect')?.addEventListener('change', e => { appData.shop.selectedModel = e.target.value; saveData(); });
            document.getElementById('geminiApiKey')?.addEventListener('input', e => { appData.shop.geminiApiKey = e.target.value; saveData(); });
            document.getElementById('testApiBtn')?.addEventListener('click', async () => {
                const key = document.getElementById('geminiApiKey').value.trim();
                const model = document.getElementById('modelSelect').value;
                if (!key) { alert(lang === 'ar' ? "أدخل المفتاح أولاً" : "Enter the key first"); return; }
                const btn = document.getElementById('testApiBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> ...`;
                btn.disabled = true;
                const result = await testGeminiConnection(key, model);
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (result === "success") alert(t('connectionSuccess'));
                else if (result === "invalid_key") alert(t('connectionFailed') + " " + (lang === 'ar' ? "مفتاح غير صالح." : "Invalid key."));
                else if (result === "cors_error") alert(t('connectionFailed') + " " + (lang === 'ar' ? "خطأ CORS. استخدم Live Server." : "CORS error. Use Live Server."));
                else alert(t('connectionFailed'));
            });
            document.getElementById('saveSettingsBtn')?.addEventListener('click', () => { saveData(); renderSettings(); });
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function toggleLang() { lang = lang === 'ar' ? 'en' : 'ar'; document.body.className = lang === 'ar' ? 'rtl' : 'ltr'; document.getElementById('langLabel').innerText = lang === 'ar' ? 'عربي' : 'EN'; document.getElementById('startBtn').innerText = lang === 'ar' ? 'ابدأ' : 'Start'; if (!isSplashVisible) render(); }
        function init() { loadData(); updateSplashLogo(); updateHeaderLogo(); applySplashBg(); document.getElementById('langToggle').addEventListener('click', toggleLang); document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => { currentView = btn.dataset.view; if (!isSplashVisible) render(); })); if (!isSplashVisible) render(); }
        init();
    </script>
</body>
</html>
